# Deploys the NEXORA website (kads-labs-app — Next.js static export) to
# GitHub Pages on every push to main.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
# If the site is served from a project path (https://<user>.github.io/nexora/),
# set basePath: "/nexora" in kads-labs-app/next.config.ts first.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kads-labs-app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: kads-labs-app
      - name: Build static site
        run: npm run build
        working-directory: kads-labs-app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kads-labs-app/out
      - id: deployment
        uses: actions/deploy-pages@v4
